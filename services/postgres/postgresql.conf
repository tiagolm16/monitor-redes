# Configuracao minima do PostgreSQL (o resto usa os padroes)
listen_addresses = '*'          # aceita conexoes TCP vindas de outros containers (porta 5432)
max_connections = 100

# pg_stat_statements: estatistica por query (chamadas, tempo medio). Precisa ser pre-carregado.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all

# Log de queries lentas: toda query acima de 200 ms vai para o log (stderr -> docker logs)
log_min_duration_statement = 200
# %h = IP de origem da conexao (usado para detectar brute force por IP)
log_line_prefix = '%m [%p] %u@%d %h '

# Fuso horario do banco e dos logs
timezone = 'America/Sao_Paulo'
log_timezone = 'America/Sao_Paulo'
