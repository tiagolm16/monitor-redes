worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;

    # Access log em JSON: facilita o monitor a contar status HTTP (200/404/500/401)
    # sem precisar de regex. escape=json protege contra aspas no User-Agent.
    log_format json_log escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr","peer":"$realip_remote_addr",'
        '"method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
        '"request_time":$request_time,"user":"$remote_user","user_agent":"$http_user_agent"}';

    # Volume compartilhado com o container monitor (somente leitura la)
    access_log /var/log/nginx-json/access.log json_log;
    error_log  /dev/stderr warn;

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        # real_ip: quem fala direto com o nginx e o "peer" (aqui, um container). Se o peer for confiavel
        # (set_real_ip_from), o nginx troca $remote_addr pelo IP informado no header X-Forwarded-For,
        # como faria atras de um balanceador ou CDN. So a rede interna do Docker e confiavel: um cliente
        # de fora nao consegue se passar por outro IP. "peer" no log guarda o IP da conexao TCP real.
        set_real_ip_from 172.28.77.0/24;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        location / {
            try_files $uri $uri/ =404;
        }

        # stub_status: contadores internos do nginx (conexoes ativas e total de requisicoes).
        # So redes privadas podem ler; sem log para nao poluir as contagens.
        location = /nginx_status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }

        # Rota protegida por HTTP Basic Auth: sem credencial responde 401.
        # Tentativas repetidas de 401 = sinal de brute force (fase de seguranca).
        location /admin {
            auth_basic "Area restrita";
            auth_basic_user_file /etc/nginx/htpasswd;
            try_files $uri $uri/ =404;
        }

        # Erro 500 de proposito, para o loadgen gerar taxa de erro 5xx realista
        location = /erro500 {
            default_type text/plain;
            return 500 "erro interno simulado\n";
        }
    }
}
