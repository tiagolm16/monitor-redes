# Regras de alerta. Cada ciclo de coleta dura 5 s.
#
# Como o nível é decidido (a cada ciclo):
#   - vermelho se o valor ultrapassa o limiar "vermelho"      (nível 3, crítico)
#   - amarelo  se ultrapassa o limiar "amarelo"                (nível 2, atenção)
#   - verde    caso contrário                                  (nível 1, ok)
# "operador" diz o que é RUIM: ">" (valor alto e ruim) ou "<" (valor baixo e ruim).
#
# Anti-spam (histerese): o novo nível só vira oficial depois de "ciclos" leituras seguidas
# (para piorar) ou "ciclos_recuperacao" leituras seguidas (para melhorar).
#
# "agregacao": como transformar o histórico recente em UM número para comparar:
#   último (padrão) | média | max | soma | p95   sobre os últimos "janela_s" segundos.

regras:
  # ---------- Web ----------
  - id: web_disponibilidade
    servico: web
    metrica: up
    descricao: Web fora do ar (HTTP check)
    operador: "<"
    vermelho: 1            # up = 0 -> vermelho. Sem amarelo: ou está no ar, ou não está.
    ciclos: 2
    ciclos_recuperacao: 3
  - id: web_latencia_p95
    servico: web
    metrica: latency_ms
    descricao: Latência HTTP p95 (1 min)
    operador: ">"
    amarelo: 300
    vermelho: 1000
    agregacao: p95
    janela_s: 60
    unidade: ms
    ciclos: 3
    ciclos_recuperacao: 3
  - id: web_erros_5xx
    servico: web
    metrica: error_rate_5xx
    descricao: Taxa de erro 5xx (30 s)
    operador: ">"
    amarelo: 5
    vermelho: 15
    unidade: "%"
    ciclos: 3
    ciclos_recuperacao: 3

  # ---------- Banco de dados ----------
  - id: db_disponibilidade
    servico: db
    metrica: up
    descricao: PostgreSQL fora do ar
    operador: "<"
    vermelho: 1
    ciclos: 2
    ciclos_recuperacao: 3
  - id: db_conexoes
    servico: db
    metrica: connections_percent
    descricao: Conexões em uso (% do max_connections)
    operador: ">"
    amarelo: 70
    vermelho: 90
    unidade: "%"
    ciclos: 3
    ciclos_recuperacao: 3
  - id: db_slow_queries
    servico: db
    metrica: slow_queries
    descricao: Slow queries (queries/min acima de 200 ms)
    operador: ">"
    amarelo: 8
    vermelho: 20
    agregacao: soma
    janela_s: 60
    ciclos: 3
    ciclos_recuperacao: 3
  - id: db_rollbacks
    servico: db
    metrica: rollbacks_per_s
    descricao: Rollbacks por segundo (média 1 min)
    operador: ">"
    amarelo: 0.5
    vermelho: 2
    agregacao: media
    janela_s: 60
    unidade: /s
    ciclos: 3
    ciclos_recuperacao: 3

  # ---------- DNS ----------
  - id: dns_disponibilidade
    servico: dns
    metrica: up
    descricao: DNS não responde
    operador: "<"
    vermelho: 1
    ciclos: 2
    ciclos_recuperacao: 3
  - id: dns_latencia_p95
    servico: dns
    metrica: resolve_ms
    descricao: Tempo de resolução DNS p95 (1 min)
    operador: ">"
    amarelo: 100
    vermelho: 500
    agregacao: p95
    janela_s: 60
    unidade: ms
    ciclos: 3
    ciclos_recuperacao: 3
  - id: dns_falhas
    servico: dns
    metrica: failure_rate
    descricao: Falhas do servidor DNS (SERVFAIL, REFUSED, timeout; NXDOMAIN não conta)
    operador: ">"
    amarelo: 2
    vermelho: 10
    unidade: "%"
    ciclos: 3
    ciclos_recuperacao: 3

  # ---------- SMTP ----------
  - id: smtp_disponibilidade
    servico: smtp
    metrica: up
    descricao: SMTP fora do ar
    operador: "<"
    vermelho: 1
    ciclos: 2
    ciclos_recuperacao: 3
  - id: smtp_entrega
    servico: smtp
    metrica: delivery_rate
    descricao: Taxa de entrega de e-mails (1 min)
    operador: "<"
    amarelo: 95
    vermelho: 80
    unidade: "%"
    ciclos: 3
    ciclos_recuperacao: 3
  - id: smtp_fila
    servico: smtp
    metrica: queue_size
    descricao: Fila de envio
    operador: ">"
    amarelo: 5
    vermelho: 20
    ciclos: 3
    ciclos_recuperacao: 3
  - id: smtp_latencia
    servico: smtp
    metrica: send_latency_ms
    descricao: Latência de envio SMTP (média 1 min)
    operador: ">"
    amarelo: 500
    vermelho: 2000
    agregacao: media
    janela_s: 60
    unidade: ms
    ciclos: 3
    ciclos_recuperacao: 3

  # ---------- Segurança ----------
  # z-score = (RPS agora - media da baseline de 10 min) / desvio padrão da baseline.
  # Quantos desvios padrão o trafego atual esta acima do normal.
  - id: sec_ddos_zscore
    servico: security
    metrica: rps_zscore
    descricao: Anomalia de tráfego (z-score do RPS)
    operador: ">"
    amarelo: 3
    vermelho: 6
    ciclos: 2
    ciclos_recuperacao: 3
  - id: sec_ddos_razao
    servico: security
    metrica: rps_ratio
    descricao: RPS muito acima da baseline (razão)
    operador: ">"
    vermelho: 10          # 10x o tráfego normal
    unidade: x
    ciclos: 2
    ciclos_recuperacao: 3
  # Falhas de autenticação do MESMO IP em 60 s (401 no /admin + senha errada no Postgres)
  - id: sec_bruteforce_ip
    servico: security
    metrica: max_auth_failures_per_ip
    descricao: Brute force (falhas de login do mesmo IP em 60 s)
    operador: ">"
    amarelo: 10
    vermelho: 30
    ciclos: 2
    ciclos_recuperacao: 3
  # Arquivos de /config cujo SHA-256 difere da baseline. Atua imediatamente (1 ciclo).
  - id: sec_config
    servico: security
    metrica: config_changed_files
    descricao: Arquivo de configuração alterado (hash SHA-256 difere da baseline)
    operador: ">"
    amarelo: 0
    vermelho: 3
    ciclos: 1
    ciclos_recuperacao: 2
  - id: sec_vuln_critical
    servico: security
    metrica: vulns_critical_total
    descricao: Vulnerabilidades CRITICAL nas imagens (Trivy)
    operador: ">"
    amarelo: 0
    vermelho: 10
    ciclos: 2
    ciclos_recuperacao: 3
